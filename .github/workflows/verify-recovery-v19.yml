name: verify-recovery-v19
on:
  push:
    paths:
      - 'reset.html'
      - 'index.html'
      - 'app.js'
      - 'sw.js'
      - 'config.js'
      - '.github/workflows/verify-recovery-v19.yml'
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '20'}
      - run: |
          node --check app.js
          node --check sw.js
          node --check config.js
          node -e "const f=require('fs').readFileSync('reset.html','utf8');const s=f.match(/<script>([\\s\\S]*?)<\\/script>/);if(!s)process.exit(2);new (require('vm').Script)(s[1]);"
          grep -q "window.location.href='reset.html'" index.html
          grep -q "english-gym-v1-9" sw.js
