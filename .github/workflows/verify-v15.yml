name: Verify English Gym v1.5
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: JavaScript syntax checks
        run: |
          node --check app.js
          node --check feedback.js
          node --check reading.js
          node --check habits.js
          node --check ielts.js
          node --check config.js
          node --check sw.js
      - name: IELTS data and integration smoke checks
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          i=Path('ielts.js').read_text()
          h=Path('habits.js').read_text()
          c=Path('config.js').read_text()
          sw=Path('sw.js').read_text()
          assert 'IELTS Academic 7.5–8 Track' in i
          for skill in ['listening','reading','writing','speaking']:
              assert f"'{skill}'" in i or f"{skill}:" in i
          for stage in ['stage:1','stage:2','stage:3','stage:4']:
              assert stage in i
          assert "ielts:'🎯'" in h
          assert "s.src='ielts.js'" in h
          assert 'version: "1.5"' in c
          assert "english-gym-v1-5" in sw and "'ielts.js'" in sw
          assert len(re.findall(r"id:'il-",i)) >= 6
          assert len(re.findall(r"id:'ir-",i)) >= 6
          assert len(re.findall(r"id:'iw-",i)) >= 8
          assert len(re.findall(r"id:'is-",i)) >= 6
          print('v1.5 smoke checks passed')
          PY
      - name: Build clean backup
        run: |
          rm -rf .github
          zip -r English_Gym_v1.5_SECURE_FREE_正式版.zip . -x '.git/*'
      - uses: actions/upload-artifact@v4
        with:
          name: english-gym-v1.5-backup
          path: English_Gym_v1.5_SECURE_FREE_正式版.zip
          if-no-files-found: error
          retention-days: 1
